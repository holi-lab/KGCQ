[project]
name = "kgcq"
version = "1.0.0"
description = "Think Like a Doctor: Conversational Diagnosis through the Exploration of Diagnostic Knowledge Graphs (KGCQ)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.1",
    "peft==0.17.1",
    "trl==1.4.0",
    "accelerate==1.10.1",
    "datasets==4.8.5",
    "bitsandbytes==0.49.2",
    "sentence-transformers==5.1.0",
    "faiss-cpu==1.13.2",
    "openai==2.6.1",
    "requests>=2.32",
    "aiohttp>=3.10",
    "networkx==3.4.2",
    "pandas==2.3.3",
    "numpy==1.26.4",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]
human-eval = ["flask>=3.0", "openpyxl>=3.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
